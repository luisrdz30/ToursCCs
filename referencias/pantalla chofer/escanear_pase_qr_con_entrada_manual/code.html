<script>
        // Simple interaction to demonstrate the success state
        document.addEventListener('DOMContentLoaded', () => {
            const scannerTarget = document.getElementById('scanner-target');
            const successModal = document.getElementById('success-modal');

            scannerTarget.addEventListener('click', () => {
                // Hide target, show success
                successModal.classList.remove('hidden');
                successModal.classList.add('success-overlay-enter');
                
                // Add a subtle haptic feedback simulation by briefly shrinking the target
                scannerTarget.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    scannerTarget.style.transform = 'scale(1)';
                }, 150);

                // Auto hide after 3 seconds
                setTimeout(() => {
                    successModal.classList.add('hidden');
                    successModal.classList.remove('success-overlay-enter');
                }, 3000);
            });
        });
    </script>
