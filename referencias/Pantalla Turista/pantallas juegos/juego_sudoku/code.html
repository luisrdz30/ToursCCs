<style>
        .sudoku-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 20px;
            font-weight: 600;

            background-color: #ffffff;
            border: 1px solid #e1bfb5;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sudoku-cell.prefilled {
            color: #004e63;
            background-color: #f7ddd5;
            cursor: default;
        }
        .sudoku-cell.selected {
            background-color: #a8e2fd;
            border-color: #00677e;
        }
        .sudoku-cell.error {
            color: #ba1a1a;
            background-color: #ffdad6;
        }
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background-color: #004e63;
            border: 2px solid #004e63;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        /* Thick borders for 3x3 subgrids */
        .sudoku-cell:nth-child(3n) { border-right: 2px solid #004e63; }
        .sudoku-cell:nth-child(9n) { border-right: none; }
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #004e63; }
        
        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 248, 246, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.sudoku-cell:not(.prefilled)');
            
            cells.forEach(cell => {
                cell.addEventListener('click', function() {
                    // Remove selected class from all
