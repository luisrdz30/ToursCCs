<style>
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #ff6b35;
            top: -20px;
            opacity: 0;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { opacity: 1; top: -20px; transform: rotateX(0deg) rotateZ(0deg); }
            100% { opacity: 0; top: 100vh; transform: rotateX(360deg) rotateZ(360deg); }
        }
        .float-anim {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .sparkle-anim {
            animation: sparkle 2s ease-in-out infinite alternate;
        }
        @keyframes sparkle {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1.2) rotate(15deg); opacity: 1; }
        }
    </style>

<script>
        // Lightweight Confetti Generator
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#ab3500', '#ff6b35', '#00677e', '#00a7cb', '#ffdbd0'];
            const confettiCount = 50;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Randomize properties
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                
                // Randomize shapes (some squares, some thin rectangles)
                if(Math.random() > 0.5) {
                    confetti.style.width = '8px';
                    confetti.style.height = '8px';
                    confetti.style.borderRadius = '50%';
                }

                container.appendChild(confetti);
            }
        });
    </script>
